<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>Визуализация мед. анализов</title>

    <link rel="stylesheet" href="/static/styles.css" />

    <!-- Chart.js + адаптер дат -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/date-fns@2.30.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0"></script>
</head>
<body>
<div class="app-root">
    <h1 class="title">Визуализация мед. анализов</h1>

    <div class="controls-card">
        <label class="label" for="analysisTypeSelect">Тип анализа:</label>
        <select id="analysisTypeSelect" class="select"></select>
    </div>

    <div class="chart-card">
        <div class="chart-wrapper">
            <canvas id="mainChart"></canvas>
        </div>
    </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
